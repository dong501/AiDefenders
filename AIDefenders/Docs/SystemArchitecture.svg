<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AIDefenders System Architecture</title>
  <desc id="desc">Architecture diagram of the AIDefenders project showing Unity client, Python YOLO model pipeline, dataset generation, and runtime defense gameplay.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#091a2e"/>
      <stop offset="100%" stop-color="#102c43"/>
    </linearGradient>
    <linearGradient id="unity" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="python" x1="0" x2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="data" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#dfe7f3"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #e6efff; }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #edf6ff; }
      .box-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .box-text { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #eaf3ff; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #dfeafc; }
      .label { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #f0f7ff; }
      .note { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #bde1ff; }
      .box { filter: url(#shadow); rx: 18; }
      .arrow { stroke: #dfe7f3; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #dfe7f3; stroke-width: 2; fill: none; opacity: 0.9; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="800" y="64" text-anchor="middle" class="title">AIDefenders System Architecture</text>

  <!-- User / External -->
  <rect x="50" y="120" width="220" height="640" fill="#0f1f32" stroke="#4ca3ff" stroke-width="2" rx="20" class="box"/>
  <text x="160" y="160" text-anchor="middle" class="section">User / Operator</text>
  <rect x="70" y="190" width="180" height="76" rx="16" fill="#15365d" stroke="#6daefc"/>
  <text x="160" y="218" text-anchor="middle" class="box-title">Game User</text>
  <text x="160" y="244" text-anchor="middle" class="box-text">플레이/모델 선택</text>

  <rect x="70" y="290" width="180" height="102" rx="16" fill="#15365d" stroke="#6daefc"/>
  <text x="160" y="325" text-anchor="middle" class="box-title">Main Menu</text>
  <text x="160" y="348" text-anchor="middle" class="box-text">Python 환경</text>
  <text x="160" y="368" text-anchor="middle" class="box-text">Torch / YOLO 준비</text>

  <rect x="70" y="420" width="180" height="110" rx="16" fill="#15365d" stroke="#6daefc"/>
  <text x="160" y="455" text-anchor="middle" class="box-title">Campaign</text>
  <text x="160" y="478" text-anchor="middle" class="box-text">레벨 선택</text>
  <text x="160" y="500" text-anchor="middle" class="box-text">전투 시작</text>

  <rect x="70" y="560" width="180" height="110" rx="16" fill="#15365d" stroke="#6daefc"/>
  <text x="160" y="595" text-anchor="middle" class="box-title">Dataset Lab</text>
  <text x="160" y="618" text-anchor="middle" class="box-text">데이터 수집</text>
  <text x="160" y="640" text-anchor="middle" class="box-text">모델 재학습</text>

  <!-- Unity Client -->
  <rect x="330" y="120" width="420" height="640" fill="#0f1f32" stroke="#5aa9ff" stroke-width="2" rx="20" class="box"/>
  <text x="540" y="160" text-anchor="middle" class="section">Unity Client Runtime</text>

  <rect x="360" y="190" width="360" height="82" rx="18" fill="url(#unity)"/>
  <text x="540" y="224" text-anchor="middle" class="box-title">GameManager</text>
  <text x="540" y="248" text-anchor="middle" class="box-text">모델 선택 / 서버 기동 / 단계 시작</text>

  <rect x="360" y="290" width="360" height="86" rx="18" fill="#1b3f7a" stroke="#8cc8ff"/>
  <text x="540" y="323" text-anchor="middle" class="box-title">AIInputCapture</text>
  <text x="540" y="347" text-anchor="middle" class="box-text">프레임 캡처 → YOLO 결과 수신</text>

  <rect x="360" y="395" width="360" height="90" rx="18" fill="#1b3f7a" stroke="#8cc8ff"/>
  <text x="540" y="428" text-anchor="middle" class="box-title">CCTVController / Drone</text>
  <text x="540" y="452" text-anchor="middle" class="box-text">탐지 좌표 해석 / 추적 / 적/아군 분류</text>

  <rect x="360" y="505" width="360" height="116" rx="18" fill="#1b3f7a" stroke="#8cc8ff"/>
  <text x="540" y="538" text-anchor="middle" class="box-title">Game Actors</text>
  <text x="540" y="562" text-anchor="middle" class="box-text">Turret / Enemy / WaveDirector /</text>
  <text x="540" y="584" text-anchor="middle" class="box-text">TurretPlatformPlacer / Combat Systems</text>

  <!-- Python AI -->
  <rect x="790" y="120" width="360" height="640" fill="#0f1f32" stroke="#4cd6a8" stroke-width="2" rx="20" class="box"/>
  <text x="970" y="160" text-anchor="middle" class="section">Python AI Runtime</text>

  <rect x="820" y="190" width="300" height="82" rx="18" fill="url(#python)"/>
  <text x="970" y="224" text-anchor="middle" class="box-title">PythonRuntime</text>
  <text x="970" y="248" text-anchor="middle" class="box-text">vEnv / Torch / YOLO 시작</text>

  <rect x="820" y="290" width="300" height="104" rx="18" fill="#145a4d" stroke="#6fe4bd"/>
  <text x="970" y="323" text-anchor="middle" class="box-title">YOLO Server</text>
  <text x="970" y="347" text-anchor="middle" class="box-text">HTTP health check</text>
  <text x="970" y="368" text-anchor="middle" class="box-text">객체 탐지 / 추론 결과 반환</text>

  <rect x="820" y="410" width="300" height="114" rx="18" fill="#145a4d" stroke="#6fe4bd"/>
  <text x="970" y="445" text-anchor="middle" class="box-title">Model Pipeline</text>
  <text x="970" y="468" text-anchor="middle" class="box-text">학습된 가중치</text>
  <text x="970" y="490" text-anchor="middle" class="box-text">클래스 맵 / 데이터셋 매핑</text>

  <rect x="820" y="540" width="300" height="126" rx="18" fill="#145a4d" stroke="#6fe4bd"/>
  <text x="970" y="574" text-anchor="middle" class="box-title">PyTorch / Ultralytics</text>
  <text x="970" y="598" text-anchor="middle" class="box-text">GPU/CPU 연산</text>
  <text x="970" y="620" text-anchor="middle" class="box-text">YOLOv8 / 학습 및 추론</text>

  <!-- Data / Storage -->
  <rect x="1190" y="120" width="330" height="640" fill="#0f1f32" stroke="#a78bfa" stroke-width="2" rx="20" class="box"/>
  <text x="1355" y="160" text-anchor="middle" class="section">Data / Model Storage</text>

  <rect x="1220" y="190" width="270" height="90" rx="16" fill="url(#data)"/>
  <text x="1355" y="224" text-anchor="middle" class="box-title">Dataset Manager</text>
  <text x="1355" y="246" text-anchor="middle" class="box-text">이미지/라벨 생성</text>

  <rect x="1220" y="300" width="270" height="96" rx="16" fill="#402e66" stroke="#d9c4ff"/>
  <text x="1355" y="334" text-anchor="middle" class="box-title">Datasets</text>
  <text x="1355" y="358" text-anchor="middle" class="box-text">train/val/test images</text>
  <text x="1355" y="378" text-anchor="middle" class="box-text">yaml / labels</text>

  <rect x="1220" y="415" width="270" height="96" rx="16" fill="#402e66" stroke="#d9c4ff"/>
  <text x="1355" y="449" text-anchor="middle" class="box-title">Trained Models</text>
  <text x="1355" y="473" text-anchor="middle" class="box-text">weights.pt</text>
  <text x="1355" y="493" text-anchor="middle" class="box-text">class map / 설정 파일</text>

  <rect x="1220" y="535" width="270" height="126" rx="16" fill="#402e66" stroke="#d9c4ff"/>
  <text x="1355" y="569" text-anchor="middle" class="box-title">Runtime Assets</text>
  <text x="1355" y="593" text-anchor="middle" class="box-text">Targets / Turrets /</text>
  <text x="1355" y="615" text-anchor="middle" class="box-text">Scenes / Levels / UI</text>

  <!-- flow arrows -->
  <line x1="270" y1="260" x2="330" y2="260" class="arrow"/>
  <line x1="270" y1="420" x2="330" y2="420" class="arrow"/>
  <line x1="270" y1="610" x2="330" y2="610" class="arrow"/>

  <line x1="750" y1="240" x2="790" y2="240" class="arrow"/>
  <line x1="750" y1="340" x2="790" y2="340" class="arrow"/>
  <line x1="750" y1="560" x2="790" y2="560" class="arrow"/>

  <line x1="1150" y1="240" x2="1190" y2="240" class="arrow"/>
  <line x1="1150" y1="350" x2="1190" y2="350" class="arrow"/>
  <line x1="1150" y1="460" x2="1190" y2="460" class="arrow"/>

  <!-- feedback loops -->
  <path d="M 540 780 C 630 845, 760 845, 830 780" class="thin"/>
  <text x="720" y="845" text-anchor="middle" class="note">추론 결과 → 전투 로직 / 공격 판단</text>

  <path d="M 970 760 C 970 820, 1285 820, 1285 760" class="thin"/>
  <text x="1128" y="845" text-anchor="middle" class="note">Dataset + Training → new weights → deployment</text>

  <!-- bottom summary -->
  <rect x="60" y="820" width="1480" height="110" rx="18" fill="#112c42" stroke="#8ab8ff" stroke-width="1.5"/>
  <text x="90" y="860" class="label">핵심 흐름:</text>
  <text x="220" y="860" class="small">1) 사용자/메뉴에서 모델 선택</text>
  <text x="480" y="860" class="small">2) Unity가 Python YOLO 서버 기동</text>
  <text x="790" y="860" class="small">3) CCTV/AIInputCapture가 프레임 전송</text>
  <text x="1080" y="860" class="small">4) 탐지 결과가 게임 로직에 반영</text>
  <text x="90" y="900" class="label">보조 흐름:</text>
  <text x="220" y="900" class="small">Dataset Manager가 이미지를 생성하고, 학습된 모델을 다시 Unity로 배포</text>
</svg>
